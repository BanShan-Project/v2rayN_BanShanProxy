name: Release Windows (Avalonia)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v7.25.7)
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and package Windows x64 / arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null

          # The in-app updater compares SemanticVersion(current assembly version) with the latest
          # release tag. Directory.Build.props carries the upstream version, so stamp the tag into
          # the build; otherwise a v7.25.7 release still reports 7.25.6 and every start offers the
          # same update again.
          $appVersion = $env:RELEASE_TAG.Trim()
          if ($appVersion.StartsWith('v') -or $appVersion.StartsWith('V')) { $appVersion = $appVersion.Substring(1) }
          if ($appVersion -notmatch '^\d+\.\d+\.\d+') { throw "RELEASE_TAG must look like v7.25.7, got '$env:RELEASE_TAG'" }
          Write-Host "Application version: $appVersion"

          # AmazTool (the self-updater) strips exactly one leading directory from every zip entry:
          #   var lst = entry.FullName.Split('/'); var fullName = string.Join("/", lst[1..]);
          # and skips entries without a directory (lst.Length == 1).
          # So the package must have ONE top level folder, the same layout as the official
          # v2rayN-windows-64.zip / v2rayN-windows-64-desktop.zip. Publishing the app files to the
          # archive root makes the updater skip v2rayN.exe and every dll, and leaves them next to a
          # second "v2rayN-windows-64" folder that only holds bin/.
          function Build-Arch([string]$arch, [string]$coreArch) {
            $rid = "win-$arch"
            $out = "out/$rid"
            $pkgDir = "v2rayN-windows-$coreArch"
            Write-Host "Publishing $rid to $out"
            dotnet publish ./v2rayN/AmazTool/AmazTool.csproj -c Release -r $rid `
              -p:SelfContained=true -p:PublishTrimmed=true -p:Version=$appVersion -o $out
            if ($LASTEXITCODE -ne 0) { throw "AmazTool publish failed for $rid" }
            dotnet publish ./v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r $rid `
              -p:SelfContained=true -p:Version=$appVersion -o $out
            if ($LASTEXITCODE -ne 0) { throw "v2rayN publish failed for $rid" }

            Get-ChildItem $out -Recurse -File -Include *.pdb, *.debug, *.dbg, *.sym | Remove-Item -Force

            $zip = Join-Path (Resolve-Path artifacts).Path "v2rayN-windows-$coreArch.zip"
            & curl.exe -fsSL --retry 5 --retry-all-errors `
              -o $zip "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-windows-$coreArch.zip"
            if ($LASTEXITCODE -ne 0) { throw "core-bin download failed for $coreArch" }

            Add-Type -AssemblyName System.IO.Compression.FileSystem

            # Stage the published app inside a folder named after the top level package folder and
            # let 7-Zip merge it into the core-bin archive, exactly like upstream package-zip.yml.
            # 7-Zip also rewrites the archive cleanly, which System.IO.Compression.ZipArchive.Update
            # cannot do for archives that use data descriptors.
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
            if (-not (Test-Path $sevenZip)) { throw "7-Zip not found" }

            $stageRoot = Join-Path $PWD "stage/$rid"
            if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
            $stageDir = Join-Path $stageRoot $pkgDir
            New-Item -ItemType Directory -Force $stageDir | Out-Null
            Copy-Item (Join-Path (Resolve-Path $out).Path '*') $stageDir -Recurse -Force

            Push-Location $stageRoot
            try {
              & $sevenZip a -tZip $zip $pkgDir -mx1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7-Zip packaging failed for $coreArch" }
            } finally {
              Pop-Location
            }

            # Guard: every entry must live under $pkgDir (the updater relies on it).
            $check = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $bad = $check.Entries | Where-Object {
                $n = $_.FullName.Replace('\', '/')
                $n.TrimEnd('/') -ne $pkgDir -and -not $n.StartsWith("$pkgDir/")
              }
              if ($bad) {
                throw "zip layout broken, entries outside ${pkgDir}/: $($bad[0].FullName)"
              }
            } finally {
              $check.Dispose()
            }

            # ServiceLib.UpdateService.GetUrlFromCore rewrites the GUI url to "-desktop.zip"
            # (Avalonia detection via libHarfBuzzSharp.dll), so ship that name as well.
            Copy-Item $zip (Join-Path (Resolve-Path artifacts).Path "v2rayN-windows-$coreArch-desktop.zip") -Force
          }

          Build-Arch 'x64' '64'
          Build-Arch 'arm64' 'arm64'

          Get-ChildItem artifacts | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/v2rayN-windows-64.zip
            artifacts/v2rayN-windows-64-desktop.zip
            artifacts/v2rayN-windows-arm64.zip
            artifacts/v2rayN-windows-arm64-desktop.zip
